name: Fault Injection

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  e1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Run E1 fault injection scenarios
        run: python -m pytest apps/api/tests/fault_injection -m all_scenarios -q
