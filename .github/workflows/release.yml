name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-mobile-workers:
    runs-on: ubuntu-latest
    env:
      AGENTHUB_ANDROID_KEYSTORE_BASE64: ${{ secrets.AGENTHUB_ANDROID_KEYSTORE_BASE64 }}
      AGENTHUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGENTHUB_ANDROID_KEYSTORE_PASSWORD }}
      AGENTHUB_ANDROID_KEY_ALIAS: ${{ secrets.AGENTHUB_ANDROID_KEY_ALIAS }}
      AGENTHUB_ANDROID_KEY_PASSWORD: ${{ secrets.AGENTHUB_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          npm ci

      - name: Verify public export
        run: |
          python scripts/audit-public-export.py
          python -m pytest apps/api/tests -q
          npm run web:test
          npm run mobile:test

      - name: Build web console
        run: npm run web:build

      - name: Decode Android signing key
        shell: bash
        run: |
          test -n "$AGENTHUB_ANDROID_KEYSTORE_BASE64" || (echo "Missing AGENTHUB_ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$AGENTHUB_ANDROID_KEYSTORE_PASSWORD" || (echo "Missing AGENTHUB_ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$AGENTHUB_ANDROID_KEY_ALIAS" || (echo "Missing AGENTHUB_ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$AGENTHUB_ANDROID_KEY_PASSWORD" || (echo "Missing AGENTHUB_ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "$AGENTHUB_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agenthub-upload-key.jks"
          echo "AGENTHUB_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/agenthub-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: npm run mobile:build:release

      - name: Build worker bundles
        run: python scripts/build-worker-bundle.py --output-root dist/release/workers

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist/release/android
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/release/android/agenthub-android-release.apk
          (cd dist/release && sha256sum android/agenthub-android-release.apk workers/* > SHA256SUMS)

      - name: Upload Android and worker assets
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-android-apk
          if-no-files-found: error
          path: |
            dist/release/android/agenthub-android-release.apk
            dist/release/workers/*
            dist/release/SHA256SUMS

  build-windows-desktop:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.AGENTHUB_WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.AGENTHUB_WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run desktop:package:win

      - name: Upload Windows desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-desktop-windows
          if-no-files-found: error
          path: apps/desktop/release/AgentHub-*.exe

  build-macos-desktop:
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.AGENTHUB_MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.AGENTHUB_MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.AGENTHUB_APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.AGENTHUB_APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.AGENTHUB_APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test desktop packaging
        run: npm run desktop:test

      - name: Build macOS packages
        run: npm run desktop:package:mac

      - name: Upload macOS desktop assets
        uses: actions/upload-artifact@v4
        with:
          name: agenthub-desktop-macos
          if-no-files-found: error
          path: |
            apps/desktop/release/AgentHub-*-macos-*.dmg
            apps/desktop/release/AgentHub-*-macos-*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-web-mobile-workers
      - build-windows-desktop
      - build-macos-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/upload

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/upload/**/*
