name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run API tests
        run: python -m pytest apps/api/tests -q

      - name: Run Web tests
        run: npm run web:test

      - name: Build Web console
        run: npm run web:build

      - name: Run Mobile tests
        run: npm run mobile:test

      - name: Run Desktop tests
        run: npm run desktop:test
