      .uiBody { font: 500 17px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #CBD5E1; }
      .uiBodyDark { font: 600 16px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #0F172A; }
      .chip { font: 700 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .kicker { font: 700 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #2563EB; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
